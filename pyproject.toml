[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rivora"
version = "2.0.9"
description = "Rivora server integration for ERPNext and HRMS"
requires-python = ">=3.10"
dependencies = ["firebase-admin>=6.5,<8", "wrapt", "pyfcm"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rivora*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.js", "*.css", "*.html", "*.svg", "*.csv", "config/*.json", "translations/*.csv", "public/images/*.svg", "public/css/*.css", "public/js/*.js", "public/scss/*.scss"]
